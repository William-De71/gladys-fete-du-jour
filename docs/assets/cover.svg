<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Fête du jour integration for Gladys Assistant
       (illustration): a tear-off calendar and a bouquet. Built into
       cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f0ff"/>
      <stop offset="1" stop-color="#ffeef4"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5cd6"/>
      <stop offset="1" stop-color="#6342c2"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f06595"/>
      <stop offset="1" stop-color="#d6336c"/>
    </linearGradient>
    <linearGradient id="petal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc94d"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
    <linearGradient id="wrap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e4ff"/>
      <stop offset="1" stop-color="#cfc4f5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#bg)"/>

  <!-- confetti -->
  <g opacity="0.85">
    <rect x="70" y="60" width="14" height="5" rx="2" fill="#f5a524" transform="rotate(25 77 62)"/>
    <circle cx="560" cy="70" r="4" fill="#2f9e6e"/>
    <rect x="690" y="80" width="14" height="5" rx="2" fill="#7c5cd6" transform="rotate(-30 697 82)"/>
    <circle cx="60" cy="300" r="5" fill="#7c5cd6"/>
    <circle cx="735" cy="300" r="5" fill="#f5a524"/>
    <rect x="110" y="450" width="14" height="5" rx="2" fill="#2f9e6e" transform="rotate(-15 117 452)"/>
    <rect x="640" y="430" width="14" height="5" rx="2" fill="#d6336c" transform="rotate(35 647 432)"/>
  </g>

  <!-- tear-off calendar -->
  <g>
    <rect x="156" y="116" width="300" height="300" rx="26" fill="#000" opacity="0.08"/>
    <rect x="150" y="110" width="300" height="300" rx="26" fill="#fff"/>
    <path d="M176 110 h248 a26 26 0 0 1 26 26 v64 h-300 v-64 a26 26 0 0 1 26 -26 z" fill="url(#head)"/>
    <rect x="220" y="88" width="20" height="52" rx="10" fill="#3e2a85"/>
    <rect x="360" y="88" width="20" height="52" rx="10" fill="#3e2a85"/>
    <text x="300" y="178" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="6" fill="#fff">AVRIL</text>
    <text x="300" y="320" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="120" font-weight="700" fill="#2b2d38">28</text>
    <text x="300" y="378" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="600" fill="#6342c2">Valérie</text>
    <!-- torn edge of the previous page -->
    <path d="M150 410 l15 -8 l15 8 l15 -8 l15 8 l15 -8 l15 8 l15 -8 l15 8 l15 -8 l15 8 l15 -8 l15 8 l15 -8 l15 8 l15 -8 l15 8 l15 -8 l15 8 l15 -8 l15 8 v10 h-300 z" fill="#e7e2f7"/>
  </g>

  <!-- bouquet -->
  <g>
    <path d="M560 300 C 545 250 540 220 548 190" stroke="#2f9e6e" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M590 300 C 592 240 596 200 600 160" stroke="#2f9e6e" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M620 300 C 636 250 646 220 650 196" stroke="#2f9e6e" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="572" cy="250" rx="16" ry="7" fill="#37b27c" transform="rotate(-35 572 250)"/>
    <ellipse cx="626" cy="238" rx="16" ry="7" fill="#37b27c" transform="rotate(35 626 238)"/>
    <!-- tulips -->
    <path d="M528 190 q4 -40 20 -44 q16 4 20 44 q-20 14 -40 0 z" fill="url(#petal)"/>
    <path d="M538 160 l10 16 l10 -16" stroke="#c2255c" stroke-width="3" fill="none"/>
    <path d="M580 160 q4 -42 20 -46 q16 4 20 46 q-20 14 -40 0 z" fill="url(#petal2)"/>
    <path d="M590 128 l10 16 l10 -16" stroke="#e8890c" stroke-width="3" fill="none"/>
    <path d="M630 196 q4 -40 20 -44 q16 4 20 44 q-20 14 -40 0 z" fill="url(#petal)"/>
    <path d="M640 166 l10 16 l10 -16" stroke="#c2255c" stroke-width="3" fill="none"/>
    <!-- wrapping and ribbon -->
    <path d="M520 280 L680 280 L630 420 L570 420 Z" fill="url(#wrap)"/>
    <path d="M520 280 L600 300 L680 280" stroke="#b3a5ec" stroke-width="4" fill="none"/>
    <rect x="566" y="330" width="68" height="16" rx="6" fill="#d6336c"/>
    <path d="M600 338 q-30 -30 -40 -4 q10 18 40 4 z" fill="#f06595"/>
    <path d="M600 338 q30 -30 40 -4 q-10 18 -40 4 z" fill="#f06595"/>
    <circle cx="600" cy="338" r="7" fill="#c2255c"/>
  </g>

  <text x="400" y="490" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#2b2d38">Fête du jour · Gladys Assistant</text>
</svg>
