name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste your fetedujour.fr key: the logs of the integration do not contain it.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.2.0'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → Fête du jour, or Settings → Supervision.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source of the names
      options:
        - Built-in list (no key)
        - fetedujour.fr (with a key)
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: Status of the integration
      description: The message shown at the top of its Configuration screen.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: The day concerned, and the name you expected for it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Copy the lines of the Logs tab of the integration around the problem (fetedujour.fr requests, calendar sync). In developer mode, the environment variable `DEBUG=gladys-integration-sdk` adds the SDK debug logs.
      render: text
